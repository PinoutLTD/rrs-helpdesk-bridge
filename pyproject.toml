[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rrs-helpdesk-bridge"
version = "0.1.0"
description = "Turns reports prepared by rrs-connector into Odoo Helpdesk tickets"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13,<4.0"
license = {file = "LICENSE"}

dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
rrs-helpdesk-bridge = "rrs_helpdesk_bridge.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  ".venv",
  "data",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = [
    "--disable-plugin-autoload",
]
testpaths = ["tests"]
